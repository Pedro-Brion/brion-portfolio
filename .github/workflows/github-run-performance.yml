name: "[Performance]: Lighthouse run"
run-name: Lighthouse Run ${{github.run_number}} on ${{github.ref_name}}

on: workflow_dispatch
jobs:
  Check_and_run_lighthouse:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Initing job"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts
      - run: npm --version
      - name: Install Lighthouse
        run: npm i -g lighthouse
      

  Deploy_Report:
      needs: Run_Lighthouse
      runs-on: ubuntu-latest
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deploy.outputs.page_url }}
      steps:
        - name: Deploy to GitHub Pages
          id: deploy
          uses: actions/deploy-pages@v5