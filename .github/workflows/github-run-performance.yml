name: "[Performance]: Lighthouse run"
run-name: Lighthouse run ${{github.run_number}}

on: workflow_dispatch
jobs:
  Run_Lighthouse:
    runs-on: ubuntu-latest
    steps:
      - run: echo "===Previous node==="; node --version
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18
      - name: Install Lighthouse
        run: npm i -g lighthouse
      - name: Check Versions
        run: echo "===Node Version==="; node --version ; echo "===Lighthouse Version==="; lighhouse --version
      

    