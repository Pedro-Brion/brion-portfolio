name: "[Performance] Lighthouse"
run-name: Lighthouse run ${{github.run_number}}

on: workflow_dispatch
jobs:
  Run_Lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18
      - name: Install Lighthouse
        run: npm i -g lighthouse
      - name: Check Versions
        run: |
          echo "===Node Version===" 
          node --version  
          echo "===Lighthouse Version===" 
          lighthouse --version
      - name: Run Lighthouse on prod
        run: |
          mkdir report
          lighthouse --chrome-flags="--headless --no-sandbox" https://briondev.com --output "json,html" --output-path ./report/index
      - name: Upload report
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{github.workspace}}/report

  Deploy_Report:
      needs: Run_Lighthouse
      runs-on: ubuntu-latest
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deploy.outputs.page_url }}
      steps:
        - name: Deploy to GitHub Pages
          id: deploy
          uses: actions/deploy-pages@4